<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hand Magic</title>
<style>
  :root{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Noto Sans Khmer",system-ui,sans-serif;color:#fff}
  video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
  video{filter:brightness(.8) contrast(1.05)}
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,.6);text-align:center;padding:24px}
  #ui h1{margin:0;font-size:26px;font-weight:600}
  #ui p{margin:0;opacity:.75;max-width:30ch;line-height:1.6}
  button{font:inherit;font-size:18px;padding:14px 32px;border-radius:999px;border:0;background:#ffd98a;color:#2a1700;cursor:pointer}
  #hint{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));text-align:center;font-size:14px;opacity:.8;pointer-events:none}
</style>
</head>
<body>
<video id="v" playsinline muted></video>
<canvas id="c"></canvas>
<div id="ui">
  <h1>វេទមន្តដៃ</h1>
  <p>បើកដៃ ដើម្បីបង្កើតពន្លឺ។ ក្តាប់ដៃ ដើម្បីបង្កើតបាល់ភាគល្អិតមានរង្វង់។</p>
  <button id="go">បើកកាមេរ៉ា</button>
  <p id="msg"></p>
</div>
<div id="hint"></div>

<script type="module">
import {HandLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const v = document.getElementById('v'), cv = document.getElementById('c'), ctx = cv.getContext('2d');
const ui = document.getElementById('ui'), msg = document.getElementById('msg'), hint = document.getElementById('hint');
let W, H, landmarker, mode='', lastLm=[];
function resize(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

// Map video coordinates to screen (object-fit: cover)
function map(p){
  const vw = v.videoWidth, vh = v.videoHeight;
  const s = Math.max(W/vw, H/vh);
  return {x: (p.x*vw*s) - (vw*s - W)/2, y: (p.y*vh*s) - (vh*s - H)/2};
}

const FINGERS = [[8,6],[12,10],[16,14],[20,18]];
function analyse(lm){
  const pts = lm.map(map);
  const d = (a,b)=>Math.hypot(pts[a].x-pts[b].x, pts[a].y-pts[b].y);
  let ext = 0;
  for(const [t,p] of FINGERS) if(d(t,0) > d(p,0)*1.08) ext++;
  const palm = [0,5,9,13,17].reduce((o,i)=>({x:o.x+pts[i].x/5,y:o.y+pts[i].y/5}),{x:0,y:0});
  const size = d(0,9);
  return {ext, palm, size, open: ext>=3, fist: ext<=1};
}

// Particles
const sparks = [];
function emit(x,y,n,spread,hue){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.283, s = Math.random()*spread;
    sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.3,life:1,r:Math.random()*2+.6,h:hue});
  }
}

// Sphere points + ring points (unit space)
const sphere = Array.from({length:420},(_,i)=>{
  const k=i+.5, phi=Math.acos(1-2*k/420), th=Math.PI*(1+5**.5)*k;
  return [Math.cos(th)*Math.sin(phi), Math.sin(th)*Math.sin(phi), Math.cos(phi)];
});
const ring = Array.from({length:700},()=>({a:Math.random()*6.283, r:1.5+Math.random()*1.4, y:(Math.random()-.5)*.08, s:.4+Math.random()*.6}));

const state = {}; // smoothed per-hand data
function smooth(id, t){
  const o = state[id] || (state[id] = {...t, glow:0, orb:0});
  o.x += (t.palm.x-o.x)*.5; o.y += (t.palm.y-o.y)*.5; o.size += (t.size-o.size)*.4;
  o.glow += ((t.open?1:(t.ext==2?.4:0))-o.glow)*.2;
  o.orb  += ((t.fist?1:0)-o.orb)*.15;
  return o;
}

function drawGlow(o){
  if(o.glow<.02) return;
  const R = o.size*(1.1+o.glow*.5)*(0.9+Math.random()*.1);
  const g = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,R*1.8);
  g.addColorStop(0,`rgba(255,255,255,${.95*o.glow})`);
  g.addColorStop(.25,`rgba(170,255,235,${.6*o.glow})`);
  g.addColorStop(.6,`rgba(60,200,190,${.2*o.glow})`);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x,o.y,R*1.8,0,6.283); ctx.fill();
  emit(o.x,o.y,Math.round(14*o.glow),o.size*.06,170);
}

function drawOrb(o,t){
  if(o.orb<.02) return;
  const R = o.size*1.1, rot = t*.0007, cr = Math.cos(rot), sr = Math.sin(rot), tilt = .45;
  ctx.globalAlpha = o.orb;
  // soft body
  const g = ctx.createRadialGradient(o.x,o.y,R*.2,o.x,o.y,R);
  g.addColorStop(0,'rgba(120,200,255,.25)'); g.addColorStop(1,'rgba(255,255,255,.08)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x,o.y,R,0,6.283); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1.2; ctx.stroke();
  // collect depth-sorted points: back ring, sphere, front ring
  const proj = (x,y,z)=>{ // rotate around Y then tilt around X
    const X = x*cr+z*sr, Z = -x*sr+z*cr;
    const Y = y*Math.cos(tilt)-Z*Math.sin(tilt), Z2 = y*Math.sin(tilt)+Z*Math.cos(tilt);
    return [o.x+X*R, o.y+Y*R, Z2];
  };
  const ringPts = ring.map(p=>{
    p.a += .004*p.s; return proj(Math.cos(p.a)*p.r, p.y, Math.sin(p.a)*p.r);
  });
  const dot = (x,y,z,s)=>{ ctx.fillStyle=`rgba(255,255,255,${.35+.5*(z+1)/2})`; ctx.fillRect(x,y,s,s); };
  for(const [x,y,z] of ringPts) if(z<0) dot(x,y,z,1.5);
  for(const p of sphere){ const [x,y,z]=proj(p[0],p[1],p[2]); dot(x,y,z,z>0?2:1.3); }
  for(const [x,y,z] of ringPts) if(z>=0) dot(x,y,z,2);
  // bright core
  const c = ctx.createRadialGradient(o.x,o.y,0,o.x,o.y,R*.28);
  c.addColorStop(0,'rgba(180,240,255,.9)'); c.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=c; ctx.beginPath(); ctx.arc(o.x,o.y,R*.28,0,6.283); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawSparks(){
  for(let i=sparks.length-1;i>=0;i--){
    const p = sparks[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=.02; p.life-=.018;
    if(p.life<=0){ sparks.splice(i,1); continue; }
    ctx.fillStyle = `hsla(${p.h},90%,${75+p.life*20}%,${p.life})`;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r*p.life+.3,0,6.283); ctx.fill();
  }
  if(sparks.length>2500) sparks.splice(0,sparks.length-2500);
}

let lastT = -1;
function loop(t){
  requestAnimationFrame(loop);
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation = 'lighter';
  const seen = new Set();
  if(landmarker && v.readyState>=2 && v.currentTime!==lastT){
    lastT = v.currentTime;
    const res = landmarker.detectForVideo(v, performance.now());
    lastLm = res.landmarks;
    const exts = [];
    res.landmarks.forEach((lm,i)=>{ const a = analyse(lm); seen.add(i); smooth(i,a); exts.push(a.ext); });
    hint.textContent = res.landmarks.length
      ? `[${mode}] ឃើញដៃ ${res.landmarks.length} | ម្រាមលើក ${exts.join(',')}`
      : `[${mode}] បង្ហាញដៃរបស់អ្នកមកកាមេរ៉ា`;
  }
  for(const id in state){
    const o = state[id];
    if(!seen.has(+id)){ o.glow*=.85; o.orb*=.85; }
    drawGlow(o); drawOrb(o,t);
  }
  drawSparks();
  ctx.fillStyle='#7dffd9';
  for(const lm of lastLm) for(const p of lm){ const q=map(p); ctx.fillRect(q.x-2,q.y-2,4,4); }
  ctx.globalCompositeOperation = 'source-over';
}

document.getElementById('go').onclick = async ()=>{
  msg.textContent = 'កំពុងផ្ទុក…';
  try{
    v.srcObject = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:1280,height:720},audio:false});
    await v.play();
    const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const make = (delegate)=>HandLandmarker.createFromOptions(fs,{
      baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate},
      runningMode:"VIDEO", numHands:2,
      minHandDetectionConfidence:.3, minHandPresenceConfidence:.3, minTrackingConfidence:.3
    });
    try{ landmarker = await make("CPU"); mode='CPU'; }
    catch(e){ landmarker = await make("GPU"); mode='GPU'; }
    ui.style.display='none';
    requestAnimationFrame(loop);
  }catch(e){
    msg.textContent = 'មិនអាចចាប់ផ្តើមបាន៖ ' + e.message + ' (សូមបើកតាម https ឬ localhost ហើយអនុញ្ញាតកាមេរ៉ា)';
  }
};
</script>
</body>
</html>
